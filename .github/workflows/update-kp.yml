name: Update Golosiiv KP Directory

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-kp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and parse КП page
        run: |
          python3 -c '
          import json
          import re
          import urllib.request
          from html import unescape

          url = "https://golos.kyivcity.gov.ua/pro-raion/dovidnyk-raionu/komunalni-pidpryiemstva-raionu"
          req = urllib.request.Request(
              url,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          try:
              with urllib.request.urlopen(req, timeout=20) as resp:
                  html = resp.read().decode("utf-8", errors="ignore")
          except Exception as e:
              print("Fetch warning:", e)
              raise SystemExit(0)

          h1 = re.search(r"<h1[^>]*>(.*?)</h1>", html, re.S | re.I)
          title_tag = re.search(r"<title[^>]*>(.*?)</title>", html, re.S | re.I)
          raw_title = h1.group(1) if h1 else (title_tag.group(1) if title_tag else "")
          clean_title = " ".join(unescape(re.sub(r"<[^>]+>", " ", raw_title)).split()).strip()
          if not clean_title:
              clean_title = "Комунальні підприємства Голосіївського району"

          data = [
              {
                  "date": "Голосіївська РДА • Довідник",
                  "title": clean_title,
                  "text": "Офіційний перелік та контакти комунальних підприємств Голосіївського району на порталі Голосіївської РДА.",
                  "url": url,
                  "image": "golos-logo.png"
              }
          ]

          with open("kp.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")
          '

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kp.json
          if ! git diff --staged --quiet; then
            git commit -m "Update Golosiiv KP directory data"
            git push
          fi
