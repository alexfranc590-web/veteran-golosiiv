<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ветеран Голосіївського району</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #4b5320 0%, #5c7422 14%, #6b8e23 22%, #c9dbcc 26%, #d9e8e3 30%, #e1ece8 100%);
      min-height: 100vh;
      color: #1f2419;
      line-height: 1.4;
      display: flex;
      flex-direction: column;
    }
    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 16px;
      position: relative;
      width: 100%;
    }
    main {
      padding: 16px 0 44px;
      flex: 1;
    }
    .top-left-nav {
      position: absolute;
      top: 10px;
      left: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: none;
      border: none;
      padding: 0;
      z-index: 10;
    }
    .nav-tab-btn {
      background: #262925;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 36px;
      transition: background 0.2s ease, border-color 0.2s ease;
    }
    .nav-tab-btn:hover {
      background: #343832;
    }
    .nav-tab-btn.active {
      background: #181a17;
      border-color: rgba(255, 255, 255, 0.7);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }
    .hamburger-lines {
      display: inline-flex;
      flex-direction: column;
      justify-content: space-between;
      width: 19px;
      height: 14px;
    }
    .hamburger-lines span {
      display: block;
      width: 100%;
      height: 2.5px;
      background: #ffffff;
      border-radius: 1px;
    }
    .services-arrow {
      font-size: 11px;
      transition: transform 0.28s ease;
    }
    .nav-tab-btn.open .services-arrow {
      transform: rotate(180deg);
    }
    .hero-heading-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin: 12px 0 58px;
      flex-wrap: wrap;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }
    .brand-icon {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.85);
      background: linear-gradient(180deg, rgba(168, 204, 232, 0.72) 0%, rgba(168, 204, 232, 0.72) 50%, rgba(242, 233, 178, 0.72) 50%, rgba(242, 233, 178, 0.72) 100%);
      flex-shrink: 0;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.18);
    }
    .center-banner-title {
      margin: 0;
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.25);
    }
    @media (max-width: 760px) {
      .top-left-nav {
        position: static;
        margin-bottom: 10px;
      }
    }
    .services-dropdown {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transform: translateY(-10px);
      transition: max-height 0.45s ease, opacity 0.32s ease, transform 0.32s ease;
      pointer-events: none;
    }
    .services-dropdown.open {
      max-height: 1600px;
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 275px));
      grid-template-rows: repeat(2, 120px);
      justify-content: start;
      gap: 14px;
      padding-top: 4px;
    }
    @media (max-width: 1160px) {
      .cards-grid {
        grid-template-columns: repeat(2, minmax(0, 290px));
        grid-template-rows: auto;
      }
    }
    @media (max-width: 640px) {
      .cards-grid {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: auto;
      }
    }
    .card {
      background: linear-gradient(90deg, #dce4ef 0%, #e7ecf2 55%, #f0f3f6 100%);
      border-top: 3px solid #4b5320;
      border-radius: 7px;
      padding: 11px 1
