<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ветеран Голосіївського району</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #4b5320 0%, #5c7422 14%, #6b8e23 22%, #c9dbcc 26%, #d9e8e3 30%, #e1ece8 100%);
      min-height: 100vh;
      color: #1f2419;
      line-height: 1.35;
      display: flex;
      flex-direction: column;
    }
    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 16px;
      position: relative;
      width: 100%;
    }
    main {
      padding: 16px 0 44px;
      flex: 1;
    }
    .top-left-nav {
      position: absolute;
      top: 10px;
      left: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: none;
      border: none;
      padding: 0;
      z-index: 10;
    }
    .nav-tab-btn {
      background: #262925;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 36px;
      transition: background 0.2s ease, border-color 0.2s ease;
    }
    .nav-tab-btn:hover {
      background: #343832;
    }
    .nav-tab-btn.active {
      background: #181a17;
      border-color: rgba(255, 255, 255, 0.7);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }
    .hamburger-lines {
      display: inline-flex;
      flex-direction: column;
      justify-content: space-between;
      width: 19px;
      height: 14px;
    }
    .hamburger-lines span {
      display: block;
      width: 100%;
      height: 2.5px;
      background: #ffffff;
      border-radius: 1px;
    }
    .services-arrow {
      font-size: 11px;
      transition: transform 0.28s ease;
    }
    .nav-tab-btn.open .services-arrow {
      transform: rotate(180deg);
    }
    .hero-heading-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin: 12px 0 58px;
      flex-wrap: wrap;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }
    .brand-icon {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.85);
      background: linear-gradient(180deg, rgba(168, 204, 232, 0.72) 0%, rgba(168, 204, 232, 0.72) 50%, rgba(242, 233, 178, 0.72) 50%, rgba(242, 233, 178, 0.72) 100%);
      flex-shrink: 0;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.18);
    }
    .center-banner-title {
      margin: 0;
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.25);
    }
    @media (max-width: 760px) {
      .top-left-nav {
        position: static;
        margin-bottom: 10px;
      }
    }
    .services-dropdown {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      transform: translateY(-10px);
      transition: max-height 0.45s ease, opacity 0.32s ease, transform 0.32s ease;
      pointer-events: none;
    }
    .services-dropdown.open {
      max-height: 1600px;
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 265px));
      grid-template-rows: repeat(2, 112px);
      justify-content: start;
      gap: 12px;
      padding-top: 4px;
    }
    @media (max-width: 1160px) {
      .cards-grid {
        grid-template-columns: repeat(2, minmax(0, 280px));
        grid-template-rows: auto;
      }
    }
    @media (max-width: 640px) {
      .cards-grid {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: auto;
      }
    }
    .card {
      background: linear-gradient(90deg, #dce4ef 0%, #e7ecf2 55%, #f0f3f6 100%);
      border-top: 3px solid #4b5320;
      border-radius: 7px;
      padding: 10px 13px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 5px;
      height: 112px;
      overflow: hidden;
    }
    @media (max-width: 1160px) {
      .card {
        height: auto;
        min-height: 112px;
      }
    }
    .diya-card-slot {
      grid-column: 4;
      grid-row: 1;
    }
    @media (max-width: 1160px) {
      .diya-card-slot {
        grid-column: auto;
        grid-row: auto;
      }
    }
    .card h3 {
      margin: 0 0 3px;
      font-size: 14.5px;
      line-height: 1.2;
      color: #1a1f14;
    }
    .card p {
      margin: 0;
      color: #4a5242;
      font-size: 12px;
      line-height: 1.25;
    }
    .card-action {
      background: none;
      border: none;
      padding: 0;
      text-align: left;
      color: #2e6b1e;
      font-weight: 700;
      font-size: 11.5px;
      line-height: 1.2;
      cursor: pointer;
    }
    .card-action:hover {
      text-decoration: underline;
      color: #4b5320;
    }
    #diya-guide {
      display: none;
      max-width: 430px;
      margin: 28px auto 0;
      padding: 16px 18px;
      background: #ffffff;
      border: 2px solid #4b5320;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      text-align: center;
    }
    .diya-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }
    .diya-header h2 {
      margin: 0;
      color: #4b5320;
      font-size: 17px;
    }
    .diya-close {
      background: #ecefe8;
      color: #1f2419;
      border: 1px solid #c6cdb9;
      border-radius: 6px;
      padding: 4px 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
    }
    #diya-step-desc {
      margin: 0 0 12px;
      color: #363d2e;
      font-size: 14px;
    }
    .diya-step img {
      max-width: 100%;
      max-height: 350px;
      width: auto;
      height: auto;
      border-radius: 8px;
      border: 1px solid #d5dacd;
    }
    .diya-controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
    }
    .diya-controls button {
      background: linear-gradient(135deg, #4b5320, #6b8e23);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 7px 13px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }
    .diya-controls button:hover:not(:disabled) {
      filter: brightness(1.08);
    }
    .diya-controls button:disabled {
      background: #c5c9be;
      cursor: not-allowed;
    }
    #diya-counter {
      font-weight: 700;
      font-size: 13px;
      min-width: 44px;
    }
    #diya-all-steps {
      display: none;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid #e0e5d8;
    }
    .all-step-item {
      margin-bottom: 14px;
    }
    .all-step-item img {
      max-width: 100%;
      max-height: 300px;
      width: auto;
      height: auto;
      border-radius: 8px;
      border: 1px solid #d5dacd;
    }
    .site-footer {
      background: #070806;
      color: #ffffff;
      padding: 28px 0;
      font-size: 14px;
    }
    .footer-inner {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      flex-wrap: wrap;
    }
    .footer-muted {
      color: #b8bdb3;
      font-size: 13px;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <main id="veteranam">
    <div class="container">
      <nav class="top-left-nav" aria-label="Меню порталу">
        <button type="button" id="btn-home" class="nav-tab-btn active" aria-label="Головна" onclick="showHome()">
          <span class="hamburger-lines" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </span>
        </button>
        <button type="button" id="btn-services" class="nav-tab-btn" aria-expanded="false" onclick="openServices()">
          <span>Сервіси</span>
          <span class="services-arrow" aria-hidden="true">▾</span>
        </button>
      </nav>

      <div class="hero-heading-row">
        <a href="#veteranam" class="brand" aria-label="Ветеран Голосіївського району" onclick="showHome(); return false;">
          <img src="favicon.png" alt="Герб порталу" class="brand-icon">
        </a>
